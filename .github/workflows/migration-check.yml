name: Backend Checks

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'src/backend/alembic/**'
      - 'src/backend/app/models/**'
      - 'src/backend/Dockerfile'
      - 'src/backend/pyproject.toml'
      - 'src/backend/uv.lock'
      - '.github/workflows/migration-check.yml'

permissions:
  contents: read

jobs:
  migration-test:
    name: Alembic upgrade/downgrade/upgrade
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sakn
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: sakn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sakn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations (upgrade -> downgrade -> upgrade)
        env:
          DATABASE_URL: postgresql+asyncpg://sakn:testpass@localhost:5432/sakn_test
          ENVIRONMENT: development
        run: |
          set -e
          echo "=== alembic upgrade head ==="
          uv run alembic upgrade head
          echo "=== alembic downgrade base ==="
          uv run alembic downgrade base
          echo "=== alembic upgrade head (re-apply) ==="
          uv run alembic upgrade head
          echo "=== All migrations are reversible ==="

  migration-test-sqlite:
    name: Alembic upgrade/downgrade/upgrade (SQLite)
    runs-on: ubuntu-latest
    # No service container: SQLite is file-based. This catches migrations that
    # rely on Postgres-only DDL (e.g. ALTER TABLE ... ADD/DROP CONSTRAINT) and
    # must use batch_alter_table to stay portable (SAKN supports SQLite).
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations (upgrade -> downgrade -> upgrade) on SQLite
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_migration_test.db
          ENVIRONMENT: development
        run: |
          set -e
          echo "=== alembic upgrade head ==="
          uv run alembic upgrade head
          echo "=== alembic downgrade base ==="
          uv run alembic downgrade base
          echo "=== alembic upgrade head (re-apply) ==="
          uv run alembic upgrade head
          echo "=== All migrations are reversible on SQLite ==="

  docker-smoke:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t sakn-backend:ci-test -f src/backend/Dockerfile src/backend/
