name: Dependency Scan

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 7 * * 1'  # Weekly Monday 07:23 UTC

permissions:
  contents: read

jobs:
  backend-pip-audit:
    name: Backend (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync --frozen
      - name: Install pip-audit
        run: uv pip install pip-audit
      - name: Run pip-audit
        run: uv run pip-audit --desc on

  frontend-npm-audit:
    name: Frontend (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit (with tracked exception allowlist)
        shell: bash
        run: |
          set -euo pipefail
          # Accepted vulnerabilities — each MUST be tracked by an open issue
          # documented in docs/qa/dependency-scanning.md (Active Exceptions).
          ALLOWLIST=()

          audit_json=$(npm audit --audit-level=high --json || true)

          mapfile -t found < <(
            jq -r '
              [.vulnerabilities[]?
                | select(.severity == "high" or .severity == "critical")
                | .via[]?
                | select(type == "object")
                | .url // empty
                | capture("(?<id>GHSA-[A-Za-z0-9-]+)").id
              ] | unique | .[]
            ' <<< "$audit_json"
          )

          unexpected=()
          for id in "${found[@]}"; do
            [ -z "$id" ] && continue
            case " ${ALLOWLIST[*]} " in
              *" $id "*) ;;
              *) unexpected+=("$id") ;;
            esac
          done

          if (( ${#unexpected[@]} > 0 )); then
            echo "::error::High/critical vulnerabilities not in allowlist:"
            printf '  - https://github.com/advisories/%s\n' "${unexpected[@]}"
            echo "---"
            jq '.vulnerabilities' <<< "$audit_json"
            exit 1
          fi

          if (( ${#found[@]} > 0 )); then
            echo "All ${#found[@]} reported high/critical vulnerability(ies) are in the allowlist:"
            printf '  - %s\n' "${found[@]}"
          else
            echo "No high/critical vulnerabilities."
          fi
